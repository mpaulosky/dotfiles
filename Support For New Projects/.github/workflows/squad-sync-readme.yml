---
# Syncs README.md (root) -> docs/README.md via a PR back to protected main.
# Keeps the docs folder reference copy in sync without direct pushes to main.
name: Sync README to docs

"on":
  push:
    branches: ["main"]
    paths:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "sync-readme"
  cancel-in-progress: true

env:
  MAIN_BRANCH: >-
    ${{ vars.SQUAD_MAIN_BRANCH ||
    github.event.repository.default_branch || 'main' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare synced docs README
        id: prepare_sync_readme
        run: |
          cp README.md docs/README.md

          if git diff --quiet docs/README.md; then
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp docs/README.md "$RUNNER_TEMP/README.sync-readme.docs.md"
          git restore docs/README.md
          echo "docs_changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit synced docs README to automation branch
        id: commit_sync_readme
        if: steps.prepare_sync_readme.outputs.docs_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "${MAIN_BRANCH}" --depth=1
          git switch -C automation/sync-readme "origin/${MAIN_BRANCH}"
          cp "$RUNNER_TEMP/README.sync-readme.docs.md" docs/README.md

          if git diff --quiet docs/README.md; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No docs/README.md changes to commit against ${MAIN_BRANCH}"
            exit 0
          fi

          git add docs/README.md
          git commit -m "docs: sync README.md -> docs/README.md [skip ci]"
          git push --force-with-lease origin HEAD
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Create or reuse README sync PR to main
        if: steps.commit_sync_readme.outputs.committed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const mainBranch = process.env.MAIN_BRANCH;
            const head = `${owner}:automation/sync-readme`;

            const openPrs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: mainBranch,
              head,
              per_page: 1
            });

            if (openPrs.data.length > 0) {
              core.info(
                `Existing README sync PR found: #${openPrs.data[0].number}`
              );
              return;
            }

            const created = await github.rest.pulls.create({
              owner,
              repo,
              base: mainBranch,
              head: 'automation/sync-readme',
              title: 'docs: sync README.md -> docs/README.md',
              body: [
                'Automated README sync PR for protected main.',
                '',
                '- Trigger: push to `main` affecting `README.md`',
                '- Behavior: commits `docs/README.md` updates to',
                '  `automation/sync-readme`',
                '- Target: opens or reuses a PR into `main`'
              ].join('\n')
            });

            core.info(`Created README sync PR #${created.data.number}`);
