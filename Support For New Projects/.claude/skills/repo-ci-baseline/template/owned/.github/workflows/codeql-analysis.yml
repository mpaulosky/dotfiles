# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
---
name: "CodeQL"

"on":
  push:
    branches:
      - main
    paths:
      - "**.cs"
      - "**.csproj"
      - ".github/workflows/**"

  # Not a required check, and main's push and weekly runs still cover the
  # code, so a docs-only PR (such as a release blog PR) skips the analysis.
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"

  workflow_dispatch:
    inputs:
      reason:
        description: "The reason for running the workflow"
        required: true
        default: "Manual run"

  schedule:
    - cron: "31 0 * * 5"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # actions: CodeQL's GitHub Actions queries (script injection,
        # over-broad permissions, untrusted checkouts) over .github/workflows.
        language: ["csharp", "actions"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Skip a language that has nothing to analyze yet (C# autobuild fails
      # with "Could not auto-detect a suitable build method").
      - name: Detect sources
        id: detect
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          case "$LANGUAGE" in
            csharp) patterns=('*.csproj') ;;
            actions) patterns=('.github/workflows/*.yml' '.github/workflows/*.yaml') ;;
          esac
          if [ -n "$(git ls-files "${patterns[@]}")" ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ${LANGUAGE} sources found — skipping CodeQL analysis."
          fi

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        if: steps.detect.outputs.has_code == 'true'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # Buildless extraction: no .NET SDK setup or restore needed, and
          # the actions language only supports none.
          build-mode: none

      - name: Perform CodeQL Analysis
        if: steps.detect.outputs.has_code == 'true'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
