---
name: Copilot Review Probe

# Temporary: shows whether a Copilot review's completion fires workflow_run,
# and whether GitHub holds the run for approval as it does a
# pull_request_review run that Copilot triggers (TicketManager #113). If it
# fires, the Template's PR Auto-Merge can re-check a PR the moment Copilot's
# review lands. Removed once the answer is recorded.
"on":  # zizmor: ignore[dangerous-triggers] no permissions, no checkout, logs only
  workflow_run:
    workflows: ["Copilot"]
    types: [completed]

permissions: {}

jobs:
  probe:
    name: Log the Copilot review run
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Log what the event carries
        env:
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "run: ${RUN_NAME} (${RUN_EVENT}, ${CONCLUSION}) by ${ACTOR}"
            echo "head: ${HEAD_BRANCH} @ ${HEAD_SHA}"
            echo "pull_requests: ${PULL_REQUESTS}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
