---
# yamllint config shared by the Lint YAML workflow and scripts/gate.sh.
extends: default

ignore: |
  node_modules/
  **/node_modules/
  team-docs/

rules:
  line-length:
    max: 200
    allow-non-breakable-inline-mappings: true
  truthy:
    allowed-values: ['true', 'false', 'on']
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
  # GitHub Actions expressions and scripts often need more than yamllint's
  # default of one space before an inline comment.
  comments:
    min-spaces-from-content: 1
