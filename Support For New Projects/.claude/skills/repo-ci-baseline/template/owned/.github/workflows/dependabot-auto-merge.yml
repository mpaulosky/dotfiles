---
# yamllint disable rule:line-length
name: Dependabot Auto-Merge

# pull_request_target (flagged by zizmor) is safe here: the job never checks
# out PR code, it only calls the API to enable auto-merge on Dependabot's PRs.
"on":  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pullRequestId = context.payload.pull_request.node_id;
            const pullNumber = context.payload.pull_request.number;
            try {
              await github.graphql(
                `mutation EnableAutoMerge($pullRequestId: ID!) {
                   enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                     pullRequest { number }
                   }
                 }`,
                { pullRequestId }
              );
              core.info(`Enabled auto-merge for PR #${pullNumber}.`);
            } catch (error) {
              const message = error.message ?? String(error);
              if (message.includes("already enabled")) {
                core.info(`Auto-merge already enabled for PR #${pullNumber}.`);
                return;
              }
              throw error;
            }
