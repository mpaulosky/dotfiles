---
name: PR Auto-Merge

"on":
  pull_request:
    types: [opened, ready_for_review, reopened, edited, synchronize]
    branches: [main]
  status:
  check_suite:
    types: [completed, requested, rerequested]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge for same-repo PRs
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullRequestPayload = context.payload.pull_request;
            const statusPayload = context.payload.status;
            const checkSuitePayload = context.payload.check_suite;

            let pullNumber;
            if (pullRequestPayload) {
              pullNumber = pullRequestPayload.number;
            } else if (statusPayload) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: statusPayload.sha
              });

              const matching = associated.data.find((pr) => {
                return (
                  pr.state === "open" &&
                  !pr.merged_at &&
                  !pr.draft &&
                  pr.head?.repo?.full_name === `${owner}/${repo}`
                );
              });

              if (!matching) {
                core.info(
                  `Skipping status update for ${statusPayload.sha}: no open PR is associated.`
                );
                return;
              }

              pullNumber = matching.number;
            } else if (checkSuitePayload) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: checkSuitePayload.head_sha
              });

              const matching = associated.data.find((pr) => {
                return (
                  pr.state === "open" &&
                  !pr.merged_at &&
                  !pr.draft &&
                  pr.head?.repo?.full_name === `${owner}/${repo}`
                );
              });

              if (!matching) {
                core.info(
                  `Skipping check suite update for ${checkSuitePayload.head_sha}: no open PR is associated.`
                );
                return;
              }

              pullNumber = matching.number;
            }

            if (!pullNumber) {
              core.info("No pull request number was resolved for this event.");
              return;
            }

            const pull = pullRequestPayload ??
              await github.rest.pulls.get({ owner, repo, pull_number: pullNumber }).then((result) => result.data);

            if (pull.merged_at || pull.state !== "open") {
              core.info(
                `Skipping PR #${pullNumber}: ` +
                `state=${pull.state}, merged_at=${pull.merged_at ?? "null"}.`
              );
              return;
            }

            if (pull.draft || pull.head?.repo?.full_name !== `${owner}/${repo}`) {
              core.info(
                `Skipping PR #${pullNumber}: draft or not a same-repo branch.`
              );
              return;
            }

            const status = await github.graphql(
              `query AutoMergeStatus(
                 $owner: String!,
                 $repo: String!,
                 $number: Int!
               ) {
                 repository(owner: $owner, name: $repo) {
                   pullRequest(number: $number) {
                     id
                     number
                     state
                     merged
                     mergeable
                     mergeStateStatus
                     autoMergeRequest {
                       enabledAt
                       mergeMethod
                     }
                   }
                 }
               }`,
              { owner, repo, number: pullNumber }
            );

            const currentPr = status.repository.pullRequest;
            if (!currentPr || currentPr.state !== "OPEN" || currentPr.merged) {
              core.info(
                `Skipping PR #${pullNumber}: already closed or merged.`
              );
              return;
            }

            if (currentPr.autoMergeRequest) {
              core.info(
                `Auto-merge already enabled on PR #${pullNumber}; ` +
                `no action needed.`
              );
              return;
            }

            const isReadyForAutoMerge =
              currentPr.mergeable === true && currentPr.mergeStateStatus === "CLEAN";

            if (!isReadyForAutoMerge) {
              core.info(
                `Skipping PR #${pullNumber}: mergeable=${String(currentPr.mergeable)} ` +
                `mergeStateStatus=${currentPr.mergeStateStatus ?? "unknown"}.`
              );
              return;
            }

            try {
              await github.graphql(
                `mutation EnableAutoMerge($pullRequestId: ID!) {
                   enablePullRequestAutoMerge(input: {
                     pullRequestId: $pullRequestId,
                     mergeMethod: SQUASH
                   }) {
                     pullRequest {
                       number
                       autoMergeRequest {
                         mergeMethod
                         enabledAt
                       }
                     }
                   }
                 }`,
                { pullRequestId: currentPr.id }
              );
            } catch (error) {
              const messages = Array.isArray(error?.errors)
                ? error.errors.map((entry) => entry?.message || "")
                : [];
              const combinedMessage = [error?.message || "", ...messages]
                .join("\n")
                .toLowerCase();

              if (
                combinedMessage.includes("already merged") ||
                combinedMessage.includes("already enabled") ||
                combinedMessage.includes("unstable status") ||
                combinedMessage.includes("mergeable") ||
                combinedMessage.includes("required status") ||
                combinedMessage.includes("not mergeable")
              ) {
                core.warning(
                  `Skipping PR #${pullNumber}: ${error.message || "Auto-merge is not ready yet."}`
                );
                return;
              }

              throw error;
            }

            core.info(`Auto-merge enabled on PR #${pullNumber}`);
