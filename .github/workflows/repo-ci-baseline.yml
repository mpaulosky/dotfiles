---
name: repo-ci-baseline Template

# Runs the repo-ci-baseline skill's test.sh on every change to the skill, so a
# broken Template is caught here before apply.sh copies it into other repos.
# This workflow belongs to dotfiles; it isn't part of the Template.

"on":
  # Every PR, not only the Template's paths: main-rules requires "Template
  # tests", and PR Auto-Merge counts a required check with no run as pending.
  pull_request:
  push:
    branches: [main]
    paths:
      - "Support For New Projects/.claude/skills/repo-ci-baseline/**"
      - ".github/workflows/repo-ci-baseline.yml"
      - ".github/workflows/claude-review.yml"
      - ".github/workflows/pr-automerge.yml"
      - ".github/scripts/post_claude_review.py"
      - ".github/hooks/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Template tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The versions scripts/gate.sh in the Template pins.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      MARKDOWNLINT_CLI2_VERSION: "0.23.3"
      YAMLLINT_VERSION: "1.38.0"
      ZIZMOR_VERSION: "1.30.1"
      CMARKGFM_VERSION: "2025.10.22"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The Template's repos use pnpm, never npm, so markdownlint-cli2 comes from pnpm too.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.6.0"

      # shellcheck, git, node and Ruby come with the runner image.
      - name: Install lint tools
        run: |
          python -m pip install pytest "yamllint==${YAMLLINT_VERSION}" "zizmor==${ZIZMOR_VERSION}" "cmarkgfm==${CMARKGFM_VERSION}"
          # The renderer oracle's kramdown, at the versions the github-pages gem pins.
          sudo gem install --no-document kramdown:2.4.0 kramdown-parser-gfm:1.1.0
          pnpm add -g "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run test.sh
        run: bash "Support For New Projects/.claude/skills/repo-ci-baseline/test.sh"
