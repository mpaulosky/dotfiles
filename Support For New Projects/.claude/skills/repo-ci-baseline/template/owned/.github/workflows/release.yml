# yamllint disable rule:line-length
---
name: Release

"on":
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Merged PR number to process"
        required: true
        type: string

# Each job grants only what it needs.
permissions: {}

env:
  # Model for the AI Summary in release blog posts (used only when the
  # ANTHROPIC_API_KEY secret is set).
  ANTHROPIC_MODEL: claude-sonnet-5

# One group for every run that can release, so releases never overlap and
# versions follow merge order. GitHub keeps only the newest pending run in a
# group and cancels the one it replaces, so each run releases every merged PR
# still owed a release (see the plan job), not just the PR that started it: a
# cancelled run's PR goes out with the next one. A run that can't release (an
# unmerged PR closing, a PR into another branch, a dispatch from a branch) gets
# a group of its own, so it can't replace a pending release run and then do
# nothing. The condition is the plan job's `if`; keep the two in step.
concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
    (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'))
    && 'release-main' || format('release-ignored-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  plan:
    # Publishes tags, releases and a docs PR, so a manual run must come from
    # main, never from a branch's copy of this file. The concurrency group at
    # the top uses the same condition.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.queue.outputs.prs }}
    steps:
      - name: Checkout main
        # zizmor: ignore[artipacked] release_queue.py fetches main again with this read-only credential.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          # Tags and history, to tell which merges the newest release holds.
          fetch-depth: 0

      - name: List the PRs to release
        id: queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # A manual run goes through the same list as a merge, so it can't
          # release a newer PR ahead of an older one still owed a release. A
          # PR that's already released isn't listed; the docs job still
          # re-delivers its post if main lacks it.
          PR_NUMBER="${INPUT_PR_NUMBER:-$EVENT_PR_NUMBER}"
          PR_NUMBER="${PR_NUMBER#\#}"
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::pr_number must be a PR number, got '${PR_NUMBER}'."
            exit 1
          fi
          PRS=$(python3 .github/scripts/release_queue.py --repo "$REPOSITORY" --pr "$PR_NUMBER")
          echo "Releasing, in order: ${PRS}"
          echo "prs=${PRS}" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.prs != '' && needs.plan.outputs.prs != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # "Resolve PR metadata" reads the PR.
      pull-requests: read
    # One PR at a time, oldest merge first. Not fail-fast, so one PR's failure
    # is reported without cancelling the rest; the ordering check in "Reserve
    # release tag" still stops any PR from overtaking one that wasn't
    # released.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.plan.outputs.prs) }}
    steps:
      - name: Checkout main
        # zizmor: ignore[artipacked] this job pushes with the checkout's credential.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          # Persisted as the git credential that pushes the release tag. Same
          # PAT-with-fallback as the docs job (see the comment there).
          token: ${{ secrets.RELEASE_PR_PAT || secrets.GITHUB_TOKEN }}

      - name: Resolve PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ matrix.pr }}
          REPOSITORY: ${{ github.repository }}
        run: |
          PR_JSON=$(gh api \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '{
              number: .number,
              title: .title,
              html_url: .html_url,
              merged: .merged,
              base_ref: .base.ref,
              merge_commit_sha: (.merge_commit_sha // ""),
              labels: [.labels[].name]
            }')

          MERGED=$(echo "$PR_JSON" | jq -r '.merged')
          if [ "$MERGED" != "true" ]; then
            echo "PR #${PR_NUMBER} is not merged; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only PRs merged into main are released; a manual run is held to
          # the same rule.
          BASE_REF=$(echo "$PR_JSON" | jq -r '.base_ref')
          if [ "$BASE_REF" != "main" ]; then
            echo "PR #${PR_NUMBER} was merged into '${BASE_REF}', not main; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TITLE=$(echo "$PR_JSON" | jq -r '.title')
          URL=$(echo "$PR_JSON" | jq -r '.html_url')
          MERGE_SHA=$(echo "$PR_JSON" | jq -r '.merge_commit_sha')
          LABELS=$(echo "$PR_JSON" | jq -c '.labels // []')

          {
            echo "skip=false"
            echo "number=$PR_NUMBER"
            echo "title<<EOF"
            echo "$TITLE"
            echo "EOF"
            echo "url=$URL"
            echo "merge_sha=$MERGE_SHA"
            echo "labels=$LABELS"
          } >> "$GITHUB_OUTPUT"

      - name: Mark merged PR as release-eligible
        if: steps.pr.outputs.skip != 'true'
        id: files
        env:
          PR_TITLE: ${{ steps.pr.outputs.title }}
        run: |
          if echo "$PR_TITLE" | grep -q '\[skip-release\]'; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=automated docs PR opted out via [skip-release] marker" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "reason=merged PR release flow" >> "$GITHUB_OUTPUT"
          fi

      - name: Check existing release marker
        if: steps.pr.outputs.skip != 'true' && steps.files.outputs.eligible == 'true'
        id: idempotency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # Match the whole "Source PR: #n" line, so PR #1 doesn't match a
          # release for #10. Drafts don't count: the planner and the ordering
          # guard ignore them too, so a PR named only by a draft is still owed
          # a published Release (and "Create release" publishes the draft).
          EXISTING_TAG=$(gh api "repos/${REPOSITORY}/releases?per_page=100" --paginate \
            | jq -rs --arg n "$PR_NUMBER" \
              '[.[][] | select(.draft | not) | select((.body // "") | test("(^|\\n)\\s*Source PR: #" + $n + "\\s*(\\r?\\n|$)")) | .tag_name] | first // empty')

          if [ -n "$EXISTING_TAG" ]; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
            echo "Release ${EXISTING_TAG} already exists for PR #${PR_NUMBER}; nothing to release."
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

      # Pushing the tag is the lock: if another release took the version
      # first, the push is rejected and the next version is tried.
      - name: Reserve release tag
        if: steps.files.outputs.eligible == 'true' && steps.idempotency.outputs.already_released != 'true'
        id: version
        env:
          LABELS_JSON: ${{ steps.pr.outputs.labels }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
          QUEUE_JSON: ${{ needs.plan.outputs.prs }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Versions follow merge order: every PR ahead of this one in the
          # queue must already have a published Release. A tag alone isn't
          # enough: a run can push its tag and fail before the Release. If one
          # is missing, stop; the next run releases both, in order.
          RELEASED_PRS=$(gh api "repos/${REPOSITORY}/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft | not) | .body // ""' \
            | sed -n 's/^[[:space:]]*Source PR: #\([0-9]*\)[[:space:]]*$/\1/p')
          for EARLIER in $(echo "$QUEUE_JSON" | jq -r --argjson pr "$PR_NUMBER" '.[:index($pr)][]'); do
            if ! grep -qx "$EARLIER" <<< "$RELEASED_PRS"; then
              echo "::error::PR #${EARLIER} merged before #${PR_NUMBER} but has no published Release yet, so #${PR_NUMBER} isn't released ahead of it."
              exit 1
            fi
          done

          # Tag the PR's merge commit, not whatever main points at by now.
          TARGET="${MERGE_SHA:-$(git rev-parse HEAD)}"

          # any() is required: with `.[] | test(...)`, jq -e exits on the
          # last label only, so e.g. ["semver:minor","bug"] would miss minor.
          BUMP="patch"
          if echo "$LABELS_JSON" | jq -e 'any(.[]; test("^(semver|release):major$"))' >/dev/null; then
            BUMP="major"
          elif echo "$LABELS_JSON" | jq -e 'any(.[]; test("^(semver|release):minor$"))' >/dev/null; then
            BUMP="minor"
          fi

          NEXT_TAG=""
          for attempt in 1 2 3 4 5; do
            git fetch --quiet --force --tags origin

            # A tag left by an earlier run that failed before its Release was
            # created is reused rather than orphaned.
            REUSED=$(git for-each-ref 'refs/tags/v*' --format='%(refname:short)|%(contents:subject)' \
              | awk -F'|' -v s="from PR #${PR_NUMBER}" 'substr($2, length($2) - length(s) + 1) == s { print $1; exit }')
            if [ -n "$REUSED" ]; then
              NEXT_TAG="$REUSED"
              BASE_VERSION="${REUSED#v}"
              echo "Reusing tag ${NEXT_TAG} from an earlier run."
              break
            fi

            # Base on the highest release tag by version, then bump exactly
            # once. Not `git describe`: that returns the nearest ancestor tag,
            # which isn't guaranteed to be the highest version.
            LAST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
            BASE_VERSION="${LAST_TAG#v}"
            BASE_VERSION="${BASE_VERSION:-0.0.0}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
            case "$BUMP" in
              major) CANDIDATE="v$((MAJOR+1)).0.0" ;;
              minor) CANDIDATE="v${MAJOR}.$((MINOR+1)).0" ;;
              *) CANDIDATE="v${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            esac

            git tag -a "$CANDIDATE" "$TARGET" -m "Release ${CANDIDATE} from PR #${PR_NUMBER}"
            if PUSH_OUTPUT=$(git push origin "refs/tags/${CANDIDATE}" 2>&1); then
              NEXT_TAG="$CANDIDATE"
              break
            fi
            git tag -d "$CANDIDATE"

            # Stop only when GitHub refused the push itself ("[remote
            # rejected]": a token without the workflow permission, a ruleset)
            # and no other release has the tag: that fails the same way every
            # time. A taken tag, or a transport failure that leaves it absent,
            # retries. ls-remote --exit-code returns 2 when the tag is absent.
            TAKEN=0
            git ls-remote --exit-code --tags origin "refs/tags/${CANDIDATE}" > /dev/null || TAKEN=$?
            if [ "$TAKEN" -eq 2 ] && grep -qF '[remote rejected]' <<< "$PUSH_OUTPUT"; then
              echo "$PUSH_OUTPUT"
              echo "::error::GitHub rejected the push of ${CANDIDATE}, and no other release has it, so retrying can't help. If the message says the token lacks the workflow scope, give RELEASE_PR_PAT Workflows: Read and write (fine-grained) or the workflow scope (classic)."
              exit 1
            fi
            if [ "$TAKEN" -eq 0 ]; then
              echo "::notice::${CANDIDATE} was taken by a concurrent release; retrying (attempt ${attempt})."
            else
              echo "$PUSH_OUTPUT"
              echo "::notice::Pushing ${CANDIDATE} failed; retrying (attempt ${attempt})."
            fi
            sleep $((attempt * 3))
          done

          if [ -z "$NEXT_TAG" ]; then
            echo "::error::Could not reserve a release tag after 5 attempts."
            exit 1
          fi

          {
            echo "bump=$BUMP"
            echo "base_version=$BASE_VERSION"
            echo "tag=$NEXT_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.files.outputs.eligible == 'true' && steps.idempotency.outputs.already_released != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
          MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
          BUMP: ${{ steps.version.outputs.bump }}
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          # "Reserve release tag" already pushed the tag at the merge commit.
          EXTRA_NOTES=$(cat <<EOF
          Source PR: #${PR_NUMBER}
          Source PR URL: ${PR_URL}
          Merge commit: ${MERGE_SHA}
          Bump policy: ${BUMP} (base ${BASE_VERSION})
          EOF
          )

          IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo "none")
          if [ "$IS_DRAFT" = "true" ]; then
            # A draft doesn't count as released anywhere in this workflow, so
            # publish it rather than leave the PR owed forever. draft_release.py
            # appends these notes unless the draft already names the PR, and
            # fails on a draft that names another one.
            printf '%s\n' "$EXTRA_NOTES" > "$RUNNER_TEMP/release-notes.txt"
            gh release view "$TAG" --json body --jq '.body' > "$RUNNER_TEMP/draft-body.txt"
            BODY=$(python3 .github/scripts/draft_release.py --pr "$PR_NUMBER" --tag "$TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.txt" < "$RUNNER_TEMP/draft-body.txt")
            gh release edit "$TAG" --draft=false --notes "$BODY"
            echo "Published the draft Release ${TAG}."
          elif [ "$IS_DRAFT" = "false" ]; then
            echo "Release ${TAG} already exists."
          else
            gh release create "$TAG" \
              --title "Release ${TAG}" \
              --generate-notes \
              --notes "$EXTRA_NOTES" \
              --verify-tag
          fi

      - name: Summary
        if: always()
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number || 'n/a' }}
          ELIGIBLE: ${{ steps.files.outputs.eligible || 'n/a' }}
          ALREADY_RELEASED: ${{ steps.idempotency.outputs.already_released || 'n/a' }}
          TAG: ${{ steps.version.outputs.tag || steps.idempotency.outputs.tag || 'n/a' }}
        run: |
          echo "PR: #${PR_NUMBER}"
          echo "Eligible: ${ELIGIBLE}"
          echo "Already released: ${ALREADY_RELEASED}"
          echo "Tag: ${TAG}"

  # One blog PR per run, not one per released PR. Each would start from main
  # and rewrite the same README and blog tables, so after the first merged the
  # rest would conflict. This job writes a post for every Release that main
  # has no post for yet (so a post from an earlier, still-open blog PR is
  # included again), rebuilds the tables once, and force-pushes the result to
  # one branch, so there's never more than one blog PR open.
  docs:
    needs: [plan, release]
    # Also after a failed or skipped release job: the Releases that did go out
    # still get their posts, and a manual run re-delivers a missing one.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        # zizmor: ignore[artipacked] this job pushes with the checkout's credential.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          # A PAT (not GITHUB_TOKEN) is required here: it's persisted as the
          # git credential for this checkout, and later used by `git push` to
          # publish the release-notes branch and by `gh pr create` to open
          # the PR. GitHub treats PRs authored by github-actions[bot] (i.e.
          # opened via GITHUB_TOKEN) as untrusted and gates every
          # pull_request-triggered workflow behind a manual "Approve and run"
          # click. Authoring as a real collaborator (via RELEASE_PR_PAT)
          # avoids that approval requirement entirely, so the PR's
          # pull_request checks (lint, CodeQL) start on their own. Falls back
          # to GITHUB_TOKEN if the PAT secret isn't configured, in which case
          # those checks wait for a manual "Approve and run".
          token: ${{ secrets.RELEASE_PR_PAT || secrets.GITHUB_TOKEN }}

      - name: Write missing blog posts and release tables
        id: docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          # Optional: without it (or when the API fails) a post is written
          # without the AI Summary section and the release carries on.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QUEUE: ${{ needs.plan.outputs.prs }}
        run: |
          # The release list can lag a Release published seconds ago, so name
          # the PRs this run released: the script lists again until each has
          # one, for up to half a minute.
          python3 .github/scripts/backfill_blog_posts.py --wait-for-prs "$(jq -r 'join(",")' <<< "${QUEUE:-[]}")"

          # git status (not git diff) so brand-new, still-untracked files count.
          if [ -z "$(git status --porcelain -- docs/blogs README.md docs/README.md docs/index.html)" ]; then
            echo "main already has every post, table and the docs/README.md copy; no blog PR needed."
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The PRs whose posts were written, from the new files' names
          # (docs/blogs/{date}-pr-{n}-{slug}.md), oldest first.
          PRS=$(git status --porcelain --untracked-files=all -- docs/blogs \
            | sed -n 's|^?? docs/blogs/[0-9-]*-pr-\([0-9]*\)-.*\.md$|\1|p' | sort -n | paste -sd ' ')
          echo "docs_changed=true" >> "$GITHUB_OUTPUT"
          echo "prs=${PRS}" >> "$GITHUB_OUTPUT"

      # main is rules-protected and requires a pull request, so the posts go
      # out on their own branch and PR. The [skip-release] title marker keeps
      # that PR's merge from starting another release.
      - name: Open or update the blog PR
        if: steps.docs.outputs.docs_changed == 'true'
        env:
          # Same PAT-with-fallback as the checkout step; gh pr create authors
          # the PR as whichever identity this token belongs to.
          GH_TOKEN: ${{ secrets.RELEASE_PR_PAT || secrets.GITHUB_TOKEN }}
          HAS_RELEASE_PR_PAT: ${{ secrets.RELEASE_PR_PAT != '' }}
          PRS: ${{ steps.docs.outputs.prs }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="docs/release-notes"
          LIST=$(for n in $PRS; do printf '#%s, ' "$n"; done | sed 's/, $//')
          BODY="Automated release blog posts for ${LIST}, opened by the release workflow. It holds every Release whose post isn't on main yet, rebuilt from main on each run. The [skip-release] title marker keeps its merge from starting another release."
          case "$(wc -w <<< "$PRS")" in
            # No new post: only the tables or the docs/README.md copy of the
            # README changed (e.g. after a README-only [skip-release] merge).
            0)
              TITLE="docs: refresh release tables and docs/README.md [skip-release]"
              BODY="Automated refresh of the release tables and the docs/README.md copy of the README, opened by the release workflow. Every Release already has its post on main. The [skip-release] title marker keeps its merge from starting another release."
              ;;
            1) TITLE="docs: add release blog for PR ${LIST} [skip-release]" ;;
            *) TITLE="docs: add release blogs for PR ${LIST} [skip-release]" ;;
          esac

          git checkout -B "$BRANCH"
          # Stage only paths that exist; git add fails on a missing pathspec
          # (e.g. docs/index.html in a repo that has removed it).
          for path in docs/blogs README.md docs/README.md docs/index.html; do
            if [ -e "$path" ]; then
              git add -- "$path"
            fi
          done
          git commit -m "$TITLE"
          # Rebuilt from main on every run, so an open blog PR is updated in
          # place (and gains any newer posts) instead of conflicting.
          git push --force origin "$BRANCH"

          if [ "$HAS_RELEASE_PR_PAT" != "true" ]; then
            echo "::notice::RELEASE_PR_PAT is not set, so $BRANCH is pushed and opened with GITHUB_TOKEN. Its pull_request workflow runs (lint, CodeQL) need a manual \"Approve and run\" before they start, and auto-merge waits on them. Set RELEASE_PR_PAT to avoid this."
          fi

          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
            echo "Updated the open blog PR #${EXISTING}." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi

          # For visibility only (CI's Docs-only label job sets it too), so a
          # missing label never fails the release.
          # || keeps a failed lookup from ending the step under bash -e.
          NUMBER=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty') || NUMBER=""
          if [ -z "$NUMBER" ] || ! gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/labels" -f "labels[]=docs-only" > /dev/null; then
            echo "::warning::Couldn't add the docs-only label to the blog PR."
          fi

          gh pr merge "$BRANCH" --auto --squash
