---
codecov:
  notify:
    wait_for_ci: true
  require_ci_to_pass: true

comment:
  behavior: default
  layout: reach,diff,flags,tree
  show_carryforward_flags: false

coverage:
  precision: 2
  range: "60...80"
  round: down
  # Codecov reads status checks only from coverage.status; a top-level
  # status key is rejected as an unknown field.
  status:
    changes: false
    default_rules:
      flag_coverage_not_uploaded_behavior: include
    # Informational: Codecov reports coverage on every PR but never fails
    # it. The gate is ci.yml's coverage check against the repo's own
    # .github/ci/coverage-threshold; Codecov's default targets compare
    # against the base instead (100% on a fully covered repo), and PR
    # Auto-Merge holds any PR with a failed check, so a red one would
    # block PRs that pass the repo's gate (#184).
    patch:
      default:
        informational: true
    project:
      default:
        informational: true

github_checks:
  annotations: true
slack_app: true
